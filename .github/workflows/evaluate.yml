name: Evaluate Day 2 Submissions

on:
  workflow_dispatch:

jobs:
  run-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Evaluator Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Sequential Evaluation
        env:
          EVAL_PAT: ${{ secrets.EVAL_PAT }}
          DAY1_SALT: "dummy_salt"
          DAY2_SALT: "dummy_salt"
        run: |
          echo "team,stream_keys,costream,qr_exports,guest_cart,moderation_dlq,observability_privacy,grid_web,total_backend,status" > day2_final_scores.csv

          while IFS= read -r repo || [ -n "$repo" ]; do
            [[ -z "$repo" || "$repo" =~ ^# ]] && continue

            team_name=$(basename "$repo")
            echo "=========================================="
            echo "Processing: $team_name ($repo)"
            echo "=========================================="

            rm -rf target_repo
            git clone --depth 1 "https://x-access-token:${EVAL_PAT}@github.com/${repo}.git" target_repo || {
              echo "$team_name,0,0,0,0,0,0,0,0,CLONE_FAILED" >> day2_final_scores.csv
              continue
            }

            cd target_repo

            if ! docker compose up -d --build; then
              echo "$team_name,0,0,0,0,0,0,0,0,DOCKER_BUILD_FAILED" >> ../day2_final_scores.csv
              docker compose down -v --remove-orphans || true
              cd ..
              rm -rf target_repo
              continue
            fi

            healthy=false
            for i in {1..60}; do
              if curl -s http://localhost:8080/health | grep -q '"status"'; then
                healthy=true
                break
              fi
              sleep 2
            done

            cd ..

            if [ "$healthy" = false ]; then
              echo "$team_name,0,0,0,0,0,0,0,0,HEALTH_TIMEOUT" >> day2_final_scores.csv
            else
              python3 audit_suite.py > result.json 2>/dev/null || echo "{}" > result.json

              python3 -c 'import json, sys; d = json.load(open("result.json")) if open("result.json").read().strip().startswith("{") else {}; sk,cs,qr,gc,md,op,gw = d.get("stream_keys",0.0), d.get("costream",0.0), d.get("qr_exports",0.0), d.get("guest_cart",0.0), d.get("moderation_dlq",0.0), d.get("observability_privacy",0.0), d.get("grid_web",0.0); tot = round(sk+cs+qr+gc+md+op+gw, 2); print(f"{sys.argv[1]},{sk},{cs},{qr},{gc},{md},{op},{gw},{tot},COMPLETED")' "$team_name" >> day2_final_scores.csv
              tail -n 1 day2_final_scores.csv
            fi

            cd target_repo
            docker compose down -v --remove-orphans || true
            cd ..
            rm -rf target_repo

          done < repos.txt

      - name: Upload Day 2 Scorecard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day2-final-scores
          path: day2_final_scores.csv
