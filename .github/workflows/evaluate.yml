name: Evaluate Day 1 Submissions

on:
  workflow_dispatch:

jobs:
  run-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Evaluator Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Build Offline Local Dummy MinIO Image
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y busybox-static
          mkdir -p /tmp/dummy-minio/bin
          cp /bin/busybox /tmp/dummy-minio/bin/busybox
          ln -sf busybox /tmp/dummy-minio/bin/sh
          ln -sf busybox /tmp/dummy-minio/bin/sleep
          cat << 'EOF' > /tmp/dummy-minio/Dockerfile
          FROM scratch
          COPY bin /bin
          ENTRYPOINT ["/bin/sleep", "infinity"]
          EOF
          docker build -t local-minio:latest /tmp/dummy-minio

      - name: Run Sequential Evaluation
        env:
          EVAL_PAT: ${{ secrets.EVAL_PAT }}
          DAY1_SALT: "dummy_eval_salt"
        run: |
          echo "team,fixtures,scoring,standings,store,roster,rbac,total,status" > final_scores.csv

          while IFS= read -r repo || [ -n "$repo" ]; do
            [[ -z "$repo" || "$repo" =~ ^# ]] && continue

            team_name=$(basename "$repo")
            echo "=========================================="
            echo "Processing: $team_name ($repo)"
            echo "=========================================="

            rm -rf target_repo
            git clone --depth 1 "https://x-access-token:${EVAL_PAT}@github.com/${repo}.git" target_repo || {
              echo "$team_name,0,0,0,0,0,0,0,0,CLONE_FAILED" >> final_scores.csv
              continue
            }

            cd target_repo

            # Swap MinIO service with local offline image and remove duplicate/conflicting keys
            python3 -c '
import glob, yaml

for filename in glob.glob("docker-compose*.y*ml"):
    try:
        with open(filename, "r") as f:
            data = yaml.safe_load(f)
        if not data or not isinstance(data, dict) or "services" not in data:
            continue
        services = data.get("services", {})
        if not isinstance(services, dict):
            continue
        for sname, sdef in list(services.items()):
            if not isinstance(sdef, dict):
                continue
            img = str(sdef.get("image", "")).lower()
            if "minio" in sname.lower() or "minio" in img:
                sdef.clear()
                sdef["image"] = "local-minio:latest"
                sdef["entrypoint"] = ["/bin/sleep", "infinity"]
                sdef["healthcheck"] = {
                    "test": ["CMD", "/bin/sh", "-c", "exit 0"],
                    "interval": "2s",
                    "timeout": "2s",
                    "retries": 1
                }
        with open(filename, "w") as f:
            yaml.dump(data, f, sort_keys=False)
    except Exception:
        pass
'

            if ! docker compose up -d --build; then
              echo "$team_name,0,0,0,0,0,0,0,0,DOCKER_BUILD_FAILED" >> ../final_scores.csv
              docker compose down -v --remove-orphans || true
              cd ..
              rm -rf target_repo
              continue
            fi

            healthy=false
            for i in {1..60}; do
              if curl -s http://localhost:8080/health | grep -q '"status"'; then
                healthy=true
                break
              fi
              sleep 2
            done

            cd ..

            if [ "$healthy" = false ]; then
              echo "$team_name,0,0,0,0,0,0,0,0,HEALTH_TIMEOUT" >> final_scores.csv
            else
              python3 audit_suite.py > result.json 2>/dev/null || echo "{}" > result.json

              python3 -c 'import json, sys; d = json.load(open("result.json")) if open("result.json").read().strip().startswith("{") else {}; f,s,st,sto,r,rb = d.get("fixtures",0.0), d.get("scoring",0.0), d.get("standings",0.0), d.get("store",0.0), d.get("roster",0.0), d.get("rbac",0.0); tot = round(f+s+st+sto+r+rb, 2); print(f"{sys.argv[1]},{f},{s},{st},{sto},{r},{rb},{tot},COMPLETED")' "$team_name" >> final_scores.csv
              tail -n 1 final_scores.csv
            fi

            cd target_repo
            docker compose down -v --remove-orphans || true
            cd ..
            rm -rf target_repo

          done < repos.txt

      - name: Upload Day 1 Scorecard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day1-final-scores
          path: final_scores.csv
